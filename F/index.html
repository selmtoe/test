<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>譜面エディタ & ビューワー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
    /* 基本的なスタイル設定 */
    :root {
        --bg-color: #1a1a2e;
        --primary-color: #4b4b7c;
        --primary-hover-color: #6a6aff;
        --font-color: #e0e0e0;
        --border-color: #4b4b7c;
        --canvas-bg-color: #0f0f18;
        --font-display: 'Orbitron', sans-serif;
        --font-ui: 'Noto Sans JP', sans-serif;
    }
    html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
    }
    body {
        background-color: var(--bg-color);
        color: var(--font-color);
        font-family: var(--font-ui);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .main-container {
        text-align: center;
        transform-origin: center center;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.3s;
    }
    #editor-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        background-color: rgba(15, 15, 24, 0.9);
        padding: 20px;
        border-radius: 10px;
        border: 2px solid var(--border-color);
        width: 95%;
        max-width: 1200px;
        max-height: 95vh;
        overflow-y: auto;
        box-sizing: border-box;
    }
    canvas {
        background-color: var(--canvas-bg-color);
        border-radius: 8px;
        border: 2px solid var(--border-color);
    }
    h2 {
        font-family: var(--font-display);
        color: var(--primary-hover-color);
        margin: 0 0 10px 0;
        border-bottom: 2px solid var(--primary-color);
        padding-bottom: 5px;
        text-align: center;
    }
    .button, button {
        background-color: var(--primary-color);
        color: var(--font-color);
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        font-family: var(--font-display);
        transition: background-color 0.2s;
        text-align: center;
        display: inline-block;
        user-select: none;
    }
    .button:hover, button:hover {
        background-color: var(--primary-hover-color);
    }
    button:disabled {
        background-color: #333;
        color: #888;
        cursor: not-allowed;
    }

    /* エディタのレイアウト */
    .edit-section {
        background-color: rgba(255,255,255,0.05);
        padding: 15px;
        border-radius: 8px;
    }
    .top-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }
    .mode-selection, .page-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }
    #page-indicator {
        font-family: var(--font-display);
        font-size: 16px;
        padding: 0 10px;
        min-width: 100px;
        text-align: center;
    }
    .player-editors {
        display: flex;
        justify-content: space-around;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 15px;
    }
    .editor-column {
        flex: 1;
        min-width: 300px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    /* カラーパレットとフィールドエディタ */
    .color-palette {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 10px;
    }
    .color-swatch {
        width: 35px;
        height: 35px;
        border-radius: 4px;
        cursor: pointer;
        border: 2px solid transparent;
        transition: all 0.2s;
        box-sizing: border-box;
    }
    .color-swatch:hover {
        transform: scale(1.1);
    }
    .color-swatch.active {
        border-color: #fff;
        box-shadow: 0 0 8px #fff;
    }
    .field-editor canvas {
        margin-bottom: 10px;
        cursor: crosshair;
        touch-action: none;
        max-width: 100%;
        height: auto;
    }
    .field-controls {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
    }
    #code-gen-modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.7);
        justify-content: center;
        align-items: center;
    }
    #code-gen-content {
        background-color: var(--bg-color);
        border: 2px solid var(--border-color);
        border-radius: 10px;
        padding: 20px;
        width: 90%;
        max-width: 800px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    #code-gen-content h2 {
        margin-top: 0;
    }
    #code-gen-tabs {
        display: flex;
        gap: 10px;
        border-bottom: 2px solid var(--primary-color);
        flex-wrap: wrap;
    }
    #code-gen-tabs .button {
        background-color: var(--primary-color);
        border-radius: 5px 5px 0 0;
        border-bottom: none;
        padding: 8px 12px;
    }
    #code-gen-tabs .button.active {
        background-color: var(--primary-hover-color);
    }
    #code-gen-output {
        width: 100%;
        height: 300px;
        background-color: var(--canvas-bg-color);
        color: var(--font-color);
        font-family: monospace;
        font-size: 14px;
        border: 1px solid var(--border-color);
        border-radius: 5px;
        padding: 10px;
        box-sizing: border-box;
        white-space: pre;
        overflow: auto;
    }
    #code-gen-controls {
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }
    .sequence-controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid var(--primary-color);
    }
    .sequence-controls label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--font-display);
    }
    .sequence-controls input {
        flex: 1;
        background-color: var(--canvas-bg-color);
        color: var(--font-color);
        border: 1px solid var(--border-color);
        border-radius: 5px;
        padding: 5px 8px;
        font-family: monospace;
        text-transform: uppercase;
    }

    /* Viewer Specific Styles */
    #viewer-container {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000; /* シミュレータのような暗い背景 */
        z-index: 500;
    }
    #viewer-canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
        background-color: transparent;
    }
    #viewer-ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* タップイベントをキャンバス/コンテナに通す */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    #viewer-controls-bottom {
        pointer-events: auto;
        padding: 20px;
        display: flex;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    }
    .viewer-nav-btn {
        font-size: 16px;
        padding: 10px 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    #viewer-page-display {
        position: absolute;
        bottom: 80px;
        width: 100%;
        text-align: center;
        font-family: var(--font-display);
        font-size: 18px;
        color: rgba(255,255,255,0.7);
        pointer-events: none;
        text-shadow: 0 0 5px #000;
    }
    /* タッチエリアの可視化（デバッグ用、実際は透明） */
    .nav-touch-zone {
        position: absolute;
        top: 0;
        height: 80%; /* 下部のボタンエリアを避ける */
        width: 50%;
        z-index: 501;
        /* background: rgba(255, 0, 0, 0.1); */ 
    }
    #nav-left { left: 0; }
    #nav-right { right: 0; }
</style>
</head>
<body>

<div class="main-container">
    <div id="editor-container">
        <!-- 上部コントロール -->
        <div class="edit-section top-controls">
            <div class="mode-selection">
                <h2>MODE</h2>
                <div class="button active" id="mode-1p">1P</div>
                <div class="button" id="mode-2p">2P</div>
            </div>
            <div class="page-controls">
                <button id="prev-page">‹ Prev</button>
                <span id="page-indicator">Page 1 / 1</span>
                <button id="next-page">Next ›</button>
                <button id="new-page" style="margin-left: 15px;">New Page</button>
                <button id="delete-page">Delete Page</button>
                <button id="start-viewer" style="margin-left: 15px; background-color: #9c27b0; font-weight: bold;">Viewer</button>
                <button id="gen-code" style="margin-left: 15px; background-color: #00a0f0;">Gen Code</button>
                <button id="send-to-simulator" style="margin-left: 5px; background-color: #00a000;">Simulator</button>
            </div>
        </div>
        <!-- プレイヤーエディタエリア -->
        <div class="player-editors">
            <!-- Player 1 エディタ -->
            <div class="editor-column" id="p1-editor-col">

                    <div class="color-palette" id="p1-palette"></div>
                    <canvas id="field-editor-canvas-p1"></canvas>
                    <div class="field-controls">
                        <button class="button" id="p1-field-shift-up">↑</button>
                        <button class="button" id="p1-field-shift-down">↓</button>
                        <button class="button" id="p1-field-shift-left">←</button>
                        <button class="button" id="p1-field-shift-right">→</button>

                    <div class="sequence-controls">
                        <label>Hold: <input type="text" id="p1-hold-input" maxlength="1" placeholder="例: T"></label>

                    </div>

            <div class="editor-column" id="p2-editor-col" style="display: none;">

                    <div class="color-palette" id="p2-palette"></div>
                    <canvas id="field-editor-canvas-p2"></canvas>
                    <div class="field-controls">
                        <button class="button" id="p2-field-shift-up">↑</button>
                        <button class="button" id="p2-field-shift-down">↓</button>
                        <button class="button" id="p2-field-shift-left">←</button>
                        <button class="button" id="p2-field-shift-right">→</button>
                        <button class="button" id="p2-field-clear">Clear</button>
                    </div>
                    <div class="sequence-controls">
                        <label>Hold: <input type="text" id="p2-hold-input" maxlength="1" placeholder="例: T"></label>
                        <label>Next: <input type="text" id="p2-next-input" placeholder="例: SZJLO"></label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Viewer Container -->
<div id="viewer-container">
    <div id="nav-left" class="nav-touch-zone"></div>
    <div id="nav-right" class="nav-touch-zone"></div>
    <canvas id="viewer-canvas"></canvas>
    <div id="viewer-ui">
        <div style="flex: 1;"></div> <!-- Spacer -->
        <div id="viewer-page-display">Page 1 / 1</div>
        <div id="viewer-controls-bottom">
            <button id="viewer-back-btn" class="button viewer-nav-btn" style="background-color: #4b4b7c;">Editorへ戻る</button>
            <button id="viewer-sim-btn" class="button viewer-nav-btn" style="background-color: #00a000;">Simulator</button>
        </div>
    </div>
</div>

<!-- Code Generation Modal -->
<div id="code-gen-modal">
    <div id="code-gen-content">
        <h2>Generate Simulator Code</h2>
        <div id="code-gen-tabs">
            <button class="button active" data-type="check">Check Blocks</button>
            <button class="button" data-type="ghost">Draw Ghost</button>
            <button class="button" data-type="place">Place Blocks</button>
            <button class="button" data-type="export">Export P1 Data</button>
        </div>
        <textarea id="code-gen-output" readonly></textarea>
        <div id="code-gen-controls">
            <button id="copy-code-button" class="button">Copy to Clipboard</button>
            <button id="close-modal-button" class="button">Close</button>
        </div>
    </div>
</div>

<script>
// 定数設定
const EDITOR_BLOCK_SIZE = 40; // 少し小さくしてモバイルで見やすく
const BOARD_WIDTH = 10;
const BOARD_VISIBLE_HEIGHT = 20;
const BOARD_HEIGHT = 40;
// カラー定義（シミュレータ風の明るい色味）
const COLORS = { 'I': '#00f0f0', 'O': '#f0f000', 'T': '#a000f0', 'L': '#f0a000', 'J': '#0000f0', 'S': '#00f000', 'Z': '#f00000', 'G': '#999999' };
const EDITOR_COLORS = {...COLORS, 'EMPTY': '#000000'};
// テトロミノ形状定義（Viewer描画用）
const TETROMINOS = {
    'I': [[0,0], [-1,0], [1,0], [2,0]],
    'O': [[0,0], [1,0], [0,-1], [1,-1]],
    'T': [[0,0], [-1,0], [1,0], [0,-1]],
    'L': [[0,0], [-1,0], [1,0], [1,-1]],
    'J': [[0,0], [-1,0], [1,0], [-1,-1]],
    'S': [[0,0], [-1,0], [0,-1], [1,-1]],
    'Z': [[0,0], [1,0], [0,-1], [-1,-1]]
};

// グローバル変数
let gameMode = '1P';
let fumenPages = [];
let currentPageIndex = 0;
let isViewerMode = false;

// --- ページ管理ロジック ---

const createEmptyBoard = () => Array.from({ length: BOARD_HEIGHT }, () => Array(BOARD_WIDTH).fill(null));

const createBlankPage = () => ({
    p1: { board: createEmptyBoard(), viewY: BOARD_HEIGHT - BOARD_VISIBLE_HEIGHT, activeColor: 'I', hold: '', next: '' },
    p2: { board: createEmptyBoard(), viewY: BOARD_HEIGHT - BOARD_VISIBLE_HEIGHT, activeColor: 'I', hold: '', next: '' }
});

function loadPage(index) {
    if (index < 0 || index >= fumenPages.length) return;
    currentPageIndex = index;

    ['p1', 'p2'].forEach(playerId => {
        const data = fumenPages[currentPageIndex][playerId];
        const palette = document.getElementById(`${playerId}-palette`);
        
        palette.querySelector('.active')?.classList.remove('active');
        const swatches = palette.querySelectorAll('.color-swatch');
        swatches.forEach(swatch => {
            if (swatch.dataset.color === data.activeColor) {
                swatch.classList.add('active');
            }
        });

        document.getElementById(`${playerId}-hold-input`).value = data.hold || '';
        document.getElementById(`${playerId}-next-input`).value = data.next || '';

        drawEditorField(playerId);
    });
    updatePageControls();
    
    if (isViewerMode) {
        drawViewer();
    }
}

function updatePageControls() {
    const text = `Page ${currentPageIndex + 1} / ${fumenPages.length}`;
    document.getElementById('page-indicator').textContent = text;
    document.getElementById('viewer-page-display').textContent = text;
    
    document.getElementById('prev-page').disabled = (currentPageIndex === 0);
    document.getElementById('next-page').disabled = (currentPageIndex === fumenPages.length - 1);
    document.getElementById('delete-page').disabled = (fumenPages.length <= 1);
}

// --- エディタ初期化 ---

function setupEditors() {
    ['p1', 'p2'].forEach(setupPlayerEditor);
}

function setupPlayerEditor(playerId) {
    const palette = document.getElementById(`${playerId}-palette`);
    palette.innerHTML = ''; // リセット

    Object.keys(EDITOR_COLORS).forEach(key => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.dataset.color = key;
        swatch.style.backgroundColor = key === 'EMPTY' ? '#333' : EDITOR_COLORS[key];
        if (key === 'EMPTY') {
            swatch.style.border = '1px dashed #fff';
            swatch.title = 'Eraser';
        }
        swatch.addEventListener('click', () => {
            fumenPages[currentPageIndex][playerId].activeColor = key;
            palette.querySelector('.active')?.classList.remove('active');
            swatch.classList.add('active');
        });
        palette.appendChild(swatch);
    });

    const canvas = document.getElementById(`field-editor-canvas-${playerId}`);
    // CanvasサイズをCSSに合わせるため、解像度倍率等は簡易的に処理
    canvas.width = BOARD_WIDTH * EDITOR_BLOCK_SIZE;
    canvas.height = BOARD_VISIBLE_HEIGHT * EDITOR_BLOCK_SIZE;
    
    let isDrawing = false;
    let isEraserMode = false;

    const getCoordsFromEvent = e => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        // スケール補正
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        const relativeX = (clientX - rect.left) * scaleX;
        const relativeY = (clientY - rect.top) * scaleY;
        
        const x = Math.floor(relativeX / EDITOR_BLOCK_SIZE);
        const y = Math.floor(relativeY / EDITOR_BLOCK_SIZE);
        return { x, y };
    };
    
    const applyDraw = (x, y) => {
        if (x < 0 || x >= BOARD_WIDTH || y < 0 || y >= BOARD_VISIBLE_HEIGHT) return;
        
        const pageData = fumenPages[currentPageIndex][playerId];
        const boardY = y + pageData.viewY;
        const newColor = isEraserMode ? null : pageData.activeColor;

        if (pageData.board[boardY][x] !== newColor) {
            pageData.board[boardY][x] = newColor;
            drawEditorField(playerId);
        }
    };

    const handleDrawStart = e => {
        if (e.type === 'touchstart') {
           // e.preventDefault(); // スクロール阻害しないように注意が必要だが、canvas内はprevent推奨
        }
        isDrawing = true;

        const { x, y } = getCoordsFromEvent(e);
        const pageData = fumenPages[currentPageIndex][playerId];
        const selectedColor = pageData.activeColor;
        const boardY = y + pageData.viewY;
        const currentCellColor = (x >= 0 && x < BOARD_WIDTH && y >= 0 && y < BOARD_VISIBLE_HEIGHT)
            ? pageData.board[boardY][x]
            : null;

        isEraserMode = (selectedColor === 'EMPTY' || currentCellColor === selectedColor);
        applyDraw(x, y);
    };

    const handleDrawMove = e => {
        if (!isDrawing) return;
        if (e.cancelable) e.preventDefault();
        const { x, y } = getCoordsFromEvent(e);
        applyDraw(x, y);
    };
    
    const handleDrawEnd = () => {
        isDrawing = false;
    };

    canvas.addEventListener('mousedown', handleDrawStart);
    canvas.addEventListener('mouseup', handleDrawEnd);
    canvas.addEventListener('mouseleave', handleDrawEnd);
    canvas.addEventListener('mousemove', handleDrawMove);
    canvas.addEventListener('touchstart', handleDrawStart, { passive: false });
    canvas.addEventListener('touchend', handleDrawEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleDrawEnd, { passive: false });
    canvas.addEventListener('touchmove', handleDrawMove, { passive: false });

    document.getElementById(`${playerId}-field-shift-up`).addEventListener('click', () => shiftField(playerId, 'up'));
    document.getElementById(`${playerId}-field-shift-down`).addEventListener('click', () => shiftField(playerId, 'down'));
    document.getElementById(`${playerId}-field-shift-left`).addEventListener('click', () => shiftField(playerId, 'left'));
    document.getElementById(`${playerId}-field-shift-right`).addEventListener('click', () => shiftField(playerId, 'right'));
    document.getElementById(`${playerId}-field-clear`).addEventListener('click', () => {
        fumenPages[currentPageIndex][playerId].board.forEach(row => row.fill(null));
        drawEditorField(playerId);
    });

    const holdInput = document.getElementById(`${playerId}-hold-input`);
    const nextInput = document.getElementById(`${playerId}-next-input`);

    holdInput.addEventListener('input', (e) => {
        const val = e.target.value.toUpperCase().trim();
        e.target.value = val;
        fumenPages[currentPageIndex][playerId].hold = val;
    });
    nextInput.addEventListener('input', (e) => {
        const val = e.target.value.toUpperCase().trim();
        e.target.value = val;
        fumenPages[currentPageIndex][playerId].next = val;
    });
}

function shiftField(playerId, direction) {
    const board = fumenPages[currentPageIndex][playerId].board;
    if (direction === 'up') {
        board.shift();
        board.push(Array(BOARD_WIDTH).fill(null));
    } else if (direction === 'down') {
        board.pop();
        board.unshift(Array(BOARD_WIDTH).fill(null));
    } else if (direction === 'left') {
        board.forEach(row => {
            row.shift();
            row.push(null);
        });
    } else if (direction === 'right') {
        board.forEach(row => {
            row.pop();
            row.unshift(null);
        });
    }
    drawEditorField(playerId);
}

function drawEditorField(playerId) {
    const canvas = document.getElementById(`field-editor-canvas-${playerId}`);
    const ctx = canvas.getContext('2d');
    const data = fumenPages[currentPageIndex][playerId];
    
    // エディタ背景
    ctx.fillStyle = '#0f0f18';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // グリッド線
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= BOARD_WIDTH; x++) {
        ctx.moveTo(x * EDITOR_BLOCK_SIZE, 0);
        ctx.lineTo(x * EDITOR_BLOCK_SIZE, canvas.height);
    }
    for (let y = 0; y <= BOARD_VISIBLE_HEIGHT; y++) {
        ctx.moveTo(0, y * EDITOR_BLOCK_SIZE);
        ctx.lineTo(canvas.width, y * EDITOR_BLOCK_SIZE);
    }
    ctx.stroke();

    // ブロック描画
    for (let y = 0; y < BOARD_VISIBLE_HEIGHT; y++) {
        for (let x = 0; x < BOARD_WIDTH; x++) {
            const pieceType = data.board[y + data.viewY]?.[x];
            if (pieceType) {
                drawSimpleBlock(ctx, x * EDITOR_BLOCK_SIZE, y * EDITOR_BLOCK_SIZE, EDITOR_BLOCK_SIZE, pieceType);
            }
        }
    }
}

function drawSimpleBlock(ctx, x, y, size, type) {
    const color = COLORS[type] || '#FFF';
    ctx.fillStyle = color;
    ctx.fillRect(x + 1, y + 1, size - 2, size - 2);
    
    // 簡易的な立体感
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(x + 1, y + 1, size - 2, size * 0.1); // Top highlight
    ctx.fillRect(x + 1, y + 1, size * 0.1, size - 2); // Left highlight
    
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(x + 1, y + size * 0.9, size - 2, size * 0.1); // Bottom shadow
    ctx.fillRect(x + size * 0.9, y + 1, size * 0.1, size - 2); // Right shadow
}

// --- ビューワーモード ---

function startViewer() {
    isViewerMode = true;
    document.getElementById('viewer-container').style.display = 'block';
    document.querySelector('.main-container').style.opacity = '0'; // エディタを隠す
    drawViewer();
}

function stopViewer() {
    isViewerMode = false;
    document.getElementById('viewer-container').style.display = 'none';
    document.querySelector('.main-container').style.opacity = '1';
}

function drawViewer() {
    const canvas = document.getElementById('viewer-canvas');
    const ctx = canvas.getContext('2d');
    
    // 画面サイズに合わせる
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const w = canvas.width;
    const h = canvas.height;
    
    // 背景クリア
    ctx.fillStyle = '#1a1a2e'; // シミュレータ風背景色
    ctx.fillRect(0, 0, w, h);
    
    const page = fumenPages[currentPageIndex];
    
    // 描画設定の計算
    let renderConfig = [];
    
    if (gameMode === '1P') {
        // 1P: 中央配置
        renderConfig.push({
            data: page.p1,
            centerX: w / 2,
            centerY: h / 2 - 20 // 少し上にずらす（下部ボタン用）
        });
    } else {
        // 2P: 左右分割
        renderConfig.push({
            data: page.p1,
            centerX: w / 4,
            centerY: h / 2 - 20
        });
        renderConfig.push({
            data: page.p2,
            centerX: w * 3 / 4,
            centerY: h / 2 - 20
        });
    }
    
    // 盤面の最大サイズ計算（画面に収まるように）
    // 1Pの場合の幅マージン考慮
    const maxBoardH = h * 0.7;
    const blockSize = Math.floor(maxBoardH / BOARD_VISIBLE_HEIGHT);
    const boardW = blockSize * BOARD_WIDTH;
    const boardH = blockSize * BOARD_VISIBLE_HEIGHT;
    
    // 2Pの場合は幅がきついかもしれないので調整
    let finalBlockSize = blockSize;
    if (gameMode === '2P' && (boardW * 2 + 40 > w)) {
        finalBlockSize = Math.floor((w / 2 - 40) / BOARD_WIDTH);
    }

    renderConfig.forEach(conf => {
        drawViewerPlayer(ctx, conf.data, conf.centerX, conf.centerY, finalBlockSize);
    });
}

function drawViewerPlayer(ctx, playerData, centerX, centerY, blkSize) {
    const boardW = blkSize * BOARD_WIDTH;
    const boardH = blkSize * BOARD_VISIBLE_HEIGHT;
    
    const startX = Math.floor(centerX - boardW / 2);
    const startY = Math.floor(centerY - boardH / 2);
    
    // --- フィールド背景 ---
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(startX, startY, boardW, boardH);
    
    // --- フィールド枠線 ---
    ctx.strokeStyle = '#4b4b7c';
    ctx.lineWidth = 2;
    ctx.strokeRect(startX - 2, startY - 2, boardW + 4, boardH + 4);

    // --- ブロック描画 ---
    for (let y = 0; y < BOARD_VISIBLE_HEIGHT; y++) {
        for (let x = 0; x < BOARD_WIDTH; x++) {
            const pieceType = playerData.board[y + playerData.viewY]?.[x];
            if (pieceType) {
                drawViewerBlock(ctx, pieceType, startX + x * blkSize, startY + y * blkSize, blkSize);
            } else {
                // グリッド線（薄く）
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 1;
                ctx.strokeRect(startX + x * blkSize, startY + y * blkSize, blkSize, blkSize);
            }
        }
    }

    // --- HOLD (左上) ---
    if (playerData.hold) {
        ctx.fillStyle = '#e0e0e0';
        ctx.font = `bold ${blkSize * 0.6}px Orbitron`;
        ctx.textAlign = 'left';
        ctx.fillText('HOLD', startX - blkSize * 3.5, startY + blkSize);
        
        const holdType = playerData.hold.toUpperCase();
        if (TETROMINOS[holdType]) {
            drawMiniMino(ctx, holdType, startX - blkSize * 2.5, startY + blkSize * 2.5, blkSize * 0.8);
        }
    }

    // --- NEXT (右上) ---
    if (playerData.next) {
        ctx.fillStyle = '#e0e0e0';
        ctx.font = `bold ${blkSize * 0.6}px Orbitron`;
        ctx.textAlign = 'left';
        ctx.fillText('NEXT', startX + boardW + blkSize * 0.5, startY + blkSize);
        
        const nextPieces = playerData.next.toUpperCase().split('').filter(c => TETROMINOS[c]);
        nextPieces.forEach((type, idx) => {
            if (idx > 4) return; // 最大5つまで
            drawMiniMino(ctx, type, startX + boardW + blkSize * 2.0, startY + blkSize * 2.5 + (idx * blkSize * 2.5), blkSize * 0.8);
        });
    }
}

function drawViewerBlock(ctx, type, x, y, size) {
    const color = COLORS[type] || '#999';
    
    // ネオン風グロー効果
    ctx.shadowBlur = 10;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.fillRect(x + 1, y + 1, size - 2, size - 2);
    ctx.shadowBlur = 0; // リセット

    // 光沢
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(x + 1, y + 1, size - 2, size * 0.3);
    
    // 枠
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, size, size);
}

function drawMiniMino(ctx, type, centerX, centerY, blockSize) {
    const shape = TETROMINOS[type];
    if (!shape) return;
    
    ctx.save();
    // 形状の中心を計算してオフセット
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    shape.forEach(p => {
        minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
        minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
    });
    // ブロックの中心ではなく、形状全体の中心を合わせる簡易計算
    // shapeの座標は(0,0)基準。
    shape.forEach(p => {
        const bx = centerX + p[0] * blockSize; // 簡易配置（中心補正なし）
        // 本来はオフセット調整が必要だが、Viewerでは大まかな位置でOKとする
        // Tetromino定義に合わせて微調整
        let offsetX = 0;
        let offsetY = 0;
        if (type === 'I') { offsetX = -0.5; offsetY = -0.5; }
        else if (type === 'O') { offsetX = -0.5; offsetY = 0.5; }
        
        drawViewerBlock(ctx, type, bx + offsetX * blockSize, centerY + p[1] * blockSize + offsetY * blockSize, blockSize);
    });
    ctx.restore();
}

// シミュレータ連携
function openSimulator() {
    const currentPage = fumenPages[currentPageIndex];
    const sanitize = (str) => str.replace(/[^IOTLSJZ]/gi, '');
    const p1Hold = sanitize(currentPage.p1.hold || '');
    const p1Next = sanitize(currentPage.p1.next || '');

    const stateData = {
        v: 2,
        m: gameMode,
        p1: {
            b: boardToString(currentPage.p1.board),
            n: p1Next,
            h: p1Hold
        },
    };

    if (gameMode === '2P') {
        const p2Hold = sanitize(currentPage.p2.hold || '');
        const p2Next = sanitize(currentPage.p2.next || '');
        stateData.p2 = {
            b: boardToString(currentPage.p2.board),
            n: p2Next,
            h: p2Hold
        };
    }

    const jsonString = JSON.stringify(stateData);
    const uint8Array = new TextEncoder().encode(jsonString);
    const base64Data = btoa(String.fromCharCode.apply(null, uint8Array));
    
    // 同じディレクトリにあると仮定、または相対パスで指定
    window.open(`../index.html#${base64Data}`, '_blank');
}

document.getElementById('send-to-simulator').addEventListener('click', openSimulator);
document.getElementById('viewer-sim-btn').addEventListener('click', openSimulator);

function boardToString(board) {
    return board.map(row => 
        row.map(cell => cell === null ? '_' : cell).join('')
    ).join('');
}

function updateScale() {
    if (isViewerMode) return; // ビューワー時はスケール調整不要（全画面描画のため）
    
    const mainContainer = document.querySelector('.main-container');
    mainContainer.style.transform = 'none';
    const rect = document.getElementById('editor-container').getBoundingClientRect();
    const scale = Math.min(
        window.innerWidth / (rect.width + 20),
        window.innerHeight / (rect.height + 20)
    );
    // 拡大しすぎないように
    if (scale < 1) {
       // mainContainer.style.transform = `scale(${scale})`;
       // transform scaleはレイアウト崩れの原因になりやすいので、今回はコンテナのmax-width/heightで制御
    }
}
