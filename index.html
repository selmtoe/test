    // ==========================================
    // 第1部: 完全シミュレータ・コア仕様 (アルゴリズム設計)
    // ==========================================
    
    // ガウス消去法 (ピボット選択付き)
    function solveLinearSystem(A, b) {
      const n = b.length;
      let x = new Array(n).fill(0);
      for (let i = 0; i < n; i++) {
        let maxRow = i;
        for (let k = i + 1; k < n; k++) {
          if (Math.abs(A[k][i]) > Math.abs(A[maxRow][i])) maxRow = k;
        }
        [A[i], A[maxRow]] = [A[maxRow], A[i]];
        [b[i], b[maxRow]] = [b[maxRow], b[i]];
        
        if (Math.abs(A[i][i]) < 1e-12) continue; // ほぼ特異行列
        
        for (let k = i + 1; k < n; k++) {
          let c = -A[k][i] / A[i][i];
          for (let j = i; j < n; j++) {
            A[k][j] += c * A[i][j];
          }
          b[k] += c * b[i];
        }
      }
      for (let i = n - 1; i >= 0; i--) {
        if (Math.abs(A[i][i]) < 1e-12) {
          x[i] = 0; continue;
        }
        x[i] = b[i] / A[i][i];
        for (let k = i - 1; k >= 0; k--) {
          b[k] -= A[k][i] * x[i];
        }
      }
      return x;
    }

    // 回路シミュレータエンジン (MNA + Newton-Raphson + Backward Euler + Thermal)
    class CircuitSimulator {
      constructor() {
        this.dt = 0.001; // 1ms timestep
        this.time = 0;
        this.ambientTemp = 25.0; // ℃
        this.nodes = [];
        this.voltageSources = [];
      }

      // ノード抽出 (Union-Findで接続されたピンをグループ化)
      buildNodes(components, wires) {
        let parent = {};
        const find = (i) => {
          if (parent[i] === undefined) parent[i] = i;
          if (parent[i] === i) return i;
          return parent[i] = find(parent[i]);
        };
        const union = (i, j) => {
          let rootI = find(i);
          let rootJ = find(j);
          if (rootI !== rootJ) parent[rootI] = rootJ;
        };

        // 配線による結合
        wires.forEach(w => {
          const pin1 = `${w.from.compId}_${w.from.pinId}`;
          const pin2 = `${w.to.compId}_${w.to.pinId}`;
          union(pin1, pin2);
        });

        // グラウンドのノードを0とする
        let groundNodeRoot = null;
        components.forEach(c => {
          if (c.type === 'GROUND') {
            groundNodeRoot = find(`${c.id}_0`);
          }
        });

        let nodeMap = {};
        let nodeIndex = 1;
        
        // 全ピンにノードIDを振る
        components.forEach(c => {
          c.pins.forEach((p, idx) => {
            const pinStr = `${c.id}_${idx}`;
            const root = find(pinStr);
            if (root === groundNodeRoot) {
              nodeMap[pinStr] = 0;
            } else {
              if (nodeMap[root] === undefined) {
                nodeMap[root] = nodeIndex++;
              }
              nodeMap[pinStr] = nodeMap[root];
            }
          });
        });

        return { nodeMap, numNodes: nodeIndex - 1 };
      }

      // 1ステップ計算
      step(components, wires) {
        if(components.length === 0) return;
        
        const { nodeMap, numNodes } = this.buildNodes(components, wires);
        
        // 電圧源の数 (インダクタも未知電流として扱う)
        let vSources = [];
        components.forEach(c => {
          if (c.type === 'VOLTAGE' || c.type === 'INDUCTOR') {
            vSources.push(c);
          }
        });
        const M = vSources.length;
        const N = numNodes;
        const matrixSize = N + M;

        // Newton-Raphson Loop (最大10回)
        let nodeVoltages = new Array(N + 1).fill(0); // index 0 is ground
        let branchCurrents = new Array(M).fill(0);
        
        for (let iter = 0; iter < 10; iter++) {
          let A = Array.from({length: matrixSize}, () => new Array(matrixSize).fill(0));
          let b = new Array(matrixSize).fill(0);

          const stampConductor = (n1, n2, g) => {
            if(n1 > 0) { A[n1-1][n1-1] += g; }
            if(n2 > 0) { A[n2-1][n2-1] += g; }
            if(n1 > 0 && n2 > 0) { A[n1-1][n2-1] -= g; A[n2-1][n1-1] -= g; }
          };
          const stampCurrent = (n1, n2, i) => { // n1からn2へ i 流れる
            if(n1 > 0) b[n1-1] -= i;
            if(n2 > 0) b[n2-1] += i;
          };
          const stampVoltageSource = (n1, n2, v, mIdx) => {
            const row = N + mIdx;
            if(n1 > 0) { A[n1-1][row] += 1; A[row][n1-1] += 1; }
            if(n2 > 0) { A[n2-1][row] -= 1; A[row][n2-1] -= 1; }
            b[row] = v;
          };

          components.forEach(c => {
            if (c.broken) {
              // 壊れた部品は高抵抗（ショート破壊の場合は別だが、今回はオープン破壊とする）
              if(c.type !== 'GROUND') {
                const n1 = nodeMap[`${c.id}_0`];
                const n2 = nodeMap[`${c.id}_1`];
                if(n1 !== undefined && n2 !== undefined) stampConductor(n1, n2, 1e-9);
              }
              return;
            }

            if (c.type === 'RESISTOR') {
              const n1 = nodeMap[`${c.id}_0`];
              const n2 = nodeMap[`${c.id}_1`];
              if(n1 !== undefined && n2 !== undefined) {
                const R = c.params.R || 1000;
                stampConductor(n1, n2, 1.0 / R);
              }
            }
            else if (c.type === 'VOLTAGE') {
              const n1 = nodeMap[`${c.id}_0`]; // +
              const n2 = nodeMap[`${c.id}_1`]; // -
              const mIdx = vSources.findIndex(vs => vs.id === c.id);
              if(n1 !== undefined && n2 !== undefined && mIdx !== -1) {
                stampVoltageSource(n1, n2, c.params.V || 5, mIdx);
              }
            }
            else if (c.type === 'CAPACITOR') {
              // 後退オイラー法: i(t) = C/dt * v(t) - C/dt * v(t-dt)
              const n1 = nodeMap[`${c.id}_0`];
              const n2 = nodeMap[`${c.id}_1`];
              if(n1 !== undefined && n2 !== undefined) {
                const C = c.params.C || 0.000001;
                const g = C / this.dt;
                const prevV = (c.state && c.state.v) ? c.state.v : 0;
                const ieq = g * prevV; // 等価電流源
                stampConductor(n1, n2, g);
                stampCurrent(n1, n2, -ieq); // n2からn1へ電流源
              }
            }
            else if (c.type === 'INDUCTOR') {
               // 後退オイラー法: v(t) = L/dt * i(t) - L/dt * i(t-dt)
               // 電圧源として扱い、V = L/dt * i(t) - L/dt * i(t-dt) を組み込む（実装略化のため今回は抵抗成分付きで扱うか、簡単なモデルに）
               const n1 = nodeMap[`${c.id}_0`];
               const n2 = nodeMap[`${c.id}_1`];
               const mIdx = vSources.findIndex(vs => vs.id === c.id);
               if(n1 !== undefined && n2 !== undefined && mIdx !== -1) {
                 const L = c.params.L || 0.001;
                 const prevI = (c.state && c.state.i) ? c.state.i : 0;
                 // A(row, row)に -L/dt を入れることで L/dt * i 項を表現
                 const row = N + mIdx;
                 if(n1 > 0) { A[n1-1][row] += 1; A[row][n1-1] += 1; }
                 if(n2 > 0) { A[n2-1][row] -= 1; A[row][n2-1] -= 1; }
                 A[row][row] -= (L / this.dt);
                 b[row] = -(L / this.dt) * prevI;
               }
            }
            else if (c.type === 'DIODE' || c.type === 'LED') {
              // 非線形素子 (Newton-Raphson)
              const n1 = nodeMap[`${c.id}_0`]; // Anode
              const n2 = nodeMap[`${c.id}_1`]; // Cathode
              if(n1 !== undefined && n2 !== undefined) {
                const v1 = n1 === 0 ? 0 : nodeVoltages[n1];
                const v2 = n2 === 0 ? 0 : nodeVoltages[n2];
                let vd = v1 - v2;
                
                // Shockley diode equation parameters
                const Is = c.type === 'LED' ? 1e-20 : 1e-12; // 簡易調整
                const N_factor = c.type === 'LED' ? (c.params.Vf / 0.8) : 1; 
                const Vt = 0.02585; // 25C
                const nVt = N_factor * Vt;
                
                // クリップして発散防止
                if(vd > 3.0) vd = 3.0; 
                if(vd < -100) vd = -100;

                const expTerm = Math.exp(vd / nVt);
                const id = Is * (expTerm - 1);
                const gd = (Is / nVt) * expTerm + 1e-9; // 最小コンダクタンス
                const ieq = id - gd * vd;

                stampConductor(n1, n2, gd);
                stampCurrent(n1, n2, ieq);
                
                // 記録用
                c._tempV = vd;
                c._tempI = id;
              }
            }
          });

          // 行列を解く
          let x = solveLinearSystem(A, b);
          
          // 電圧・電流を更新
          let maxDiff = 0;
          for(let i=0; i<N; i++) {
            let newVal = x[i];
            maxDiff = Math.max(maxDiff, Math.abs(newVal - nodeVoltages[i+1]));
            nodeVoltages[i+1] = newVal;
          }
          for(let i=0; i<M; i++) {
            branchCurrents[i] = x[N+i];
          }

          if(maxDiff < 1e-6) break; // 収束
        }

        // --- 状態の更新と熱・破壊シミュレーション ---
        components.forEach(c => {
          if(c.broken) return;

          let v = 0, i = 0;
          if (c.type === 'RESISTOR') {
            const n1 = nodeMap[`${c.id}_0`] || 0;
            const n2 = nodeMap[`${c.id}_1`] || 0;
            v = nodeVoltages[n1] - nodeVoltages[n2];
            i = v / (c.params.R || 1000);
          }
          else if (c.type === 'VOLTAGE' || c.type === 'INDUCTOR') {
            const mIdx = vSources.findIndex(vs => vs.id === c.id);
            i = branchCurrents[mIdx] || 0;
            const n1 = nodeMap[`${c.id}_0`] || 0;
            const n2 = nodeMap[`${c.id}_1`] || 0;
            v = nodeVoltages[n1] - nodeVoltages[n2];
            
            if (c.type === 'INDUCTOR') {
              if(!c.state) c.state = {i: 0};
              c.state.i = i; // 状態保存
            }
          }
          else if (c.type === 'CAPACITOR') {
            const n1 = nodeMap[`${c.id}_0`] || 0;
            const n2 = nodeMap[`${c.id}_1`] || 0;
            v = nodeVoltages[n1] - nodeVoltages[n2];
            if(!c.state) c.state = {v: 0};
            c.state.v = v; // 状態保存
          }
          else if (c.type === 'DIODE' || c.type === 'LED') {
             v = c._tempV || 0;
             i = c._tempI || 0;
          }
          
          // 消費電力計算
          const power = Math.abs(v * i);
          
          // 熱シミュレーション (Tj = Ta + P * Rth)
          // 熱時定数を考慮した一次遅れ系
          const Rth = c.params.Rth || 150; // ℃/W
          const targetTj = this.ambientTemp + power * Rth;
          c.tj = c.tj ? c.tj + (targetTj - c.tj) * 0.1 : targetTj;

          // 破壊判定
          let brokenNow = false;
          let breakReason = "";
          
          if (c.tj > (c.params.maxTj || 150)) {
            brokenNow = true;
            breakReason = `熱破壊! (Tj=${Math.round(c.tj)}℃ > Max=${c.params.maxTj || 150}℃)`;
          } else if (c.params.maxV && Math.abs(v) > c.params.maxV) {
            brokenNow = true;
            breakReason = `耐圧破壊! (${Math.abs(v).toFixed(1)}V > Max=${c.params.maxV}V)`;
          } else if (c.params.maxI && Math.abs(i) > c.params.maxI) {
             brokenNow = true;
             breakReason = `過電流破壊! (${(Math.abs(i)*1000).toFixed(1)}mA > Max=${c.params.maxI*1000}mA)`;
          }

          if (brokenNow) {
            c.broken = true;
            c.breakReason = breakReason;
            console.log(`[Component Destoyed] ${c.type}(${c.id}): ${breakReason}`);
          }
          
          // 表示用データ保存
          c.currentV = v;
          c.currentI = i;
          c.currentP = power;
        });

        this.time += this.dt;
      }
    }

    // ==========================================
    // UI 定数 & コンポーネント定義
    // ==========================================
    const COMPONENT_DEF = {
      RESISTOR:  { type: 'RESISTOR', name: '抵抗', pins: [{x:0, y:1}, {x:4, y:1}], w: 4, h: 2, params: { R: 1000, Rth: 200, maxTj: 150 }, color: '#d97706' },
      VOLTAGE:   { type: 'VOLTAGE', name: '直流電源', pins: [{x:2, y:0}, {x:2, y:4}], w: 4, h: 4, params: { V: 5 }, color: '#ef4444' },
      GROUND:    { type: 'GROUND', name: 'GND', pins: [{x:2, y:0}], w: 4, h: 2, params: {}, color: '#10b981' },
      CAPACITOR: { type: 'CAPACITOR', name: 'コンデンサ', pins: [{x:0, y:1}, {x:4, y:1}], w: 4, h: 2, params: { C: 10e-6, maxV: 16 }, color: '#3b82f6' },
      INDUCTOR:  { type: 'INDUCTOR', name: 'コイル', pins: [{x:0, y:1}, {x:4, y:1}], w: 4, h: 2, params: { L: 1e-3 }, color: '#8b5cf6' },
      LED:       { type: 'LED', name: 'LED', pins: [{x:0, y:1}, {x:4, y:1}], w: 4, h: 2, params: { Vf: 2.0, maxI: 0.02, Rth: 500, maxTj: 120 }, color: '#ec4899' }
    };

    const GRID_SIZE = 20;
    
    // --- メインアプリ ---
    function App() {
      const [stageIdx, setStageIdx] = useState(0);
      const [components, setComponents] = useState([]);
      const [wires, setWires] = useState([]);
      const [isRunning, setIsRunning] = useState(false);
      const [selectedComp, setSelectedComp] = useState(null);
      const [wiringStart, setWiringStart] = useState(null);
      const [wireEndPos, setWireEndPos] = useState(null);
      
      const simRef = useRef(new CircuitSimulator());

      const canvasRef = useRef(null);
      const requestRef = useRef();

      const stage = STAGE_DATA[stageIdx];

      // シミュレーションループ
      const tick = () => {
        if (isRunning) {
          // 1フレームあたり数ステップ実行してリアルタイム性を確保
          for(let i=0; i<10; i++) {
             simRef.current.step(components, wires);
          }
          setComponents([...components]); // 強制再描画
        }
        requestRef.current = requestAnimationFrame(tick);
      };

      useEffect(() => {
        requestRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(requestRef.current);
      }, [isRunning, components, wires]);

      // 部品追加
      const addComponent = (typeKey) => {
        const def = COMPONENT_DEF[typeKey];
        const newComp = {
          ...JSON.parse(JSON.stringify(def)), // Deep copy
          id: `C_${Date.now()}_${Math.floor(Math.random()*1000)}`,
          x: 5, y: 5, // Grid coordinates
          tj: 25.0, broken: false
        };
        setComponents([...components, newComp]);
      };

      // タッチ＆マウス操作ハンドラ (SVG Canvas)
      const [dragInfo, setDragInfo] = useState(null);
      
      const getGridPos = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else if (e.changedTouches && e.changedTouches.length > 0) {
          clientX = e.changedTouches[0].clientX;
          clientY = e.changedTouches[0].clientY;
        }
        const x = Math.round((clientX - rect.left) / GRID_SIZE);
        const y = Math.round((clientY - rect.top) / GRID_SIZE);
        return {x, y};
      };

      const handlePointerDown = (e, comp, type, pinId) => {
        e.stopPropagation();
        if (type === 'pin') {
          const pinDef = comp.pins[pinId];
          if (wiringStart) {
            if (wiringStart.compId !== comp.id || wiringStart.pinId !== pinId) {
              const newWire = {
                id: `W_${Date.now()}`,
                from: { compId: wiringStart.compId, pinId: wiringStart.pinId },
                to: { compId: comp.id, pinId: pinId }
              };
              setWires([...wires, newWire]);
            }
            setWiringStart(null);
            setWireEndPos(null);
          } else {
            setWiringStart({
              compId: comp.id, pinId: pinId,
              x: comp.x + pinDef.x, y: comp.y + pinDef.y
            });
            setWireEndPos({
              x: comp.x + pinDef.x, y: comp.y + pinDef.y
            });
          }
        } else if (type === 'body') {
          setSelectedComp(comp);
          const pos = getGridPos(e);
          setDragInfo({ compId: comp.id, offsetX: comp.x - pos.x, offsetY: comp.y - pos.y });
        }
      };

      const handlePointerMove = (e) => {
        if (dragInfo) {
          const pos = getGridPos(e);
          setComponents(comps => comps.map(c =>
            c.id === dragInfo.compId ? { ...c, x: pos.x + dragInfo.offsetX, y: pos.y + dragInfo.offsetY } : c
          ));
        } else if (wiringStart) {
          const pos = getGridPos(e);
          setWireEndPos(pos);
        }
      };

      const handlePointerUp = (e) => {
        if (wiringStart && wireEndPos) {
          const isSameStart = wireEndPos.x === wiringStart.x && wireEndPos.y === wiringStart.y;
          if (!isSameStart) {
            let targetPin = null;
            for (let i = 0; i < components.length; i++) {
              const c = components[i];
              for (let j = 0; j < c.pins.length; j++) {
                if (c.x + c.pins[j].x === wireEndPos.x && c.y + c.pins[j].y === wireEndPos.y) {
                  targetPin = { compId: c.id, pinId: j };
                  break;
                }
              }
              if (targetPin) break;
            }
            if (targetPin && (targetPin.compId !== wiringStart.compId || targetPin.pinId !== wiringStart.pinId)) {
              setWires([...wires, {
                id: `W_${Date.now()}`,
                from: { compId: wiringStart.compId, pinId: wiringStart.pinId },
                to: { compId: targetPin.compId, pinId: targetPin.pinId }
              }]);
              setWiringStart(null);
              setWireEndPos(null);
            }
          }
        }
        setDragInfo(null);
      };

      const clearAll = () => {

        setComponents([]); setWires([]); setSelectedComp(null); setIsRunning(false);
        simRef.current = new CircuitSimulator();
      };

      const renderComponentSvg = (c) => {
        const x = c.x * GRID_SIZE;
        const y = c.y * GRID_SIZE;
        const cls = c.broken ? 'comp-broken' : '';
        
        let visual = null;
        if (c.type === 'RESISTOR') {
          visual = (
            <path d="M 0 20 L 15 20 L 20 10 L 30 30 L 40 10 L 50 30 L 60 10 L 65 20 L 80 20" fill="none" stroke={c.color} strokeWidth="3" />
          );
        } else if (c.type === 'VOLTAGE') {
          visual = (
            <g>
              <line x1="40" y1="0" x2="40" y2="35" stroke={c.color} strokeWidth="3" />
              <line x1="20" y1="35" x2="60" y2="35" stroke={c.color} strokeWidth="4" />
              <line x1="30" y1="45" x2="50" y2="45" stroke={c.color} strokeWidth="6" />
              <line x1="40" y1="45" x2="40" y2="80" stroke={c.color} strokeWidth="3" />
              <text x="50" y="25" fill={c.color} fontSize="14">+</text>
            </g>
          );
        } else if (c.type === 'GROUND') {
          visual = (
            <g>
              <line x1="40" y1="0" x2="40" y2="20" stroke={c.color} strokeWidth="3" />
              <line x1="20" y1="20" x2="60" y2="20" stroke={c.color} strokeWidth="3" />
              <line x1="28" y1="28" x2="52" y2="28" stroke={c.color} strokeWidth="3" />
              <line x1="36" y1="36" x2="44" y2="36" stroke={c.color} strokeWidth="3" />
            </g>
          );
        } else if (c.type === 'LED') {
           visual = (
             <g>
               <path d="M 0 20 L 30 20 L 30 10 L 50 20 L 30 30 L 30 20" fill={c.color} />
               <line x1="50" y1="5" x2="50" y2="35" stroke={c.color} strokeWidth="4" />
               <line x1="50" y1="20" x2="80" y2="20" stroke={c.color} strokeWidth="3" />
               {c.currentI > 0.001 && !c.broken && (
                 <circle cx="40" cy="20" r="15" fill={c.color} opacity={Math.min(1, c.currentI / c.params.maxI)} filter="blur(4px)" />
               )}
             </g>
           );
        } else {
           // Default box
           visual = <rect x="10" y="10" width={c.w*GRID_SIZE-20} height={c.h*GRID_SIZE-20} fill="#333" stroke={c.color} strokeWidth="2" />;
        }

        return (
          <g key={c.id} transform={`translate(${x}, ${y})`} className={cls}>
            {/* Body hit area */}
            <rect x="0" y="0" width={c.w*GRID_SIZE} height={c.h*GRID_SIZE} fill="transparent" 
                  onPointerDown={(e) => handlePointerDown(e, c, 'body')} style={{cursor: 'move'}} />
            {visual}
            
            {/* Warning Icon if broken */}
            {c.broken && <text x="10" y="-5" fontSize="20" fill="red">🔥破壊</text>}

            {c.pins.map((p, idx) => (
              <g key={idx} onPointerDown={(e) => handlePointerDown(e, c, 'pin', idx)} style={{cursor: 'crosshair'}}>
                <circle cx={p.x*GRID_SIZE} cy={p.y*GRID_SIZE} r="15" fill="transparent" />
                <circle cx={p.x*GRID_SIZE} cy={p.y*GRID_SIZE} r="6" fill="#fff" stroke="#444" strokeWidth="2" />
              </g>
            ))}
          </g>
        );
      };

      const renderWires = () => {
        return wires.map(w => {
          const c1 = components.find(c => c.id === w.from.compId);
          const c2 = components.find(c => c.id === w.to.compId);
          if(!c1 || !c2) return null;
          const p1 = c1.pins[w.from.pinId];
          const p2 = c2.pins[w.to.pinId];
          const x1 = (c1.x + p1.x) * GRID_SIZE;
          const y1 = (c1.y + p1.y) * GRID_SIZE;
          const x2 = (c2.x + p2.x) * GRID_SIZE;
          const y2 = (c2.y + p2.y) * GRID_SIZE;
          return <line key={w.id} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#cbd5e1" strokeWidth="3" strokeLinecap="round" />;
        });
      };

      return (
        <div className="flex flex-col h-screen overflow-hidden">
          {/* Header */}
          <header className="bg-gray-900 border-b border-gray-700 p-3 flex justify-between items-center z-10">
            <div>
              <h1 className="text-xl font-bold text-blue-400">究極の電子工作シミュレータ <span className="text-sm text-gray-400 font-normal ml-2">Phase {stage.phase} / Stage {stageIdx + 1}</span></h1>
            </div>
            <div className="flex gap-2">
               <button onClick={() => setStageIdx(Math.max(0, stageIdx-1))} className="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded">◀ 前へ</button>
               <button onClick={() => setStageIdx(Math.min(STAGE_DATA.length-1, stageIdx+1))} className="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded">次へ ▶</button>
            </div>
          </header>

          <div className="flex flex-1 overflow-hidden">
            {/* Sidebar */}
            <aside className="w-80 bg-gray-800 border-r border-gray-700 flex flex-col z-10 shadow-lg">
              <div className="p-4 border-b border-gray-700 bg-gray-900">
                <h2 className="text-lg font-bold text-yellow-400 mb-1">{stage.title}</h2>
                <p className="text-sm text-gray-300 leading-relaxed">{stage.desc}</p>
              </div>

              <div className="p-4 flex-1 scrollable overflow-y-auto">
                <h3 className="text-sm text-gray-400 uppercase tracking-wider mb-3">コンポーネントパレット</h3>
                <div className="grid grid-cols-2 gap-2">
                  {Object.keys(COMPONENT_DEF).map(key => (
                    <button key={key} onClick={() => addComponent(key)}
                            className="bg-gray-700 hover:bg-gray-600 p-2 rounded flex flex-col items-center transition-colors">
                      <span className="text-xs mt-1">{COMPONENT_DEF[key].name}</span>
                    </button>
                  ))}
                </div>

                {selectedComp && (
                  <div className="mt-6 bg-gray-900 p-3 rounded border border-gray-700">
                    <h3 className="text-sm font-bold text-blue-300 mb-2">プロパティ: {selectedComp.name}</h3>
                    <div className="space-y-2 text-sm">
                      {Object.keys(selectedComp.params).map(pKey => (
                        <div key={pKey} className="flex justify-between items-center">
                          <label className="text-gray-400">{pKey}</label>
                          <input type="number" 
                            className="w-20 bg-gray-800 text-white border border-gray-600 rounded px-1"
                            value={selectedComp.params[pKey]}
                            onChange={(e) => {
                              const val = parseFloat(e.target.value);
                              setComponents(comps => comps.map(c => c.id === selectedComp.id ? {...c, params: {...c.params, [pKey]: val}} : c));
                            }}
                          />
                        </div>
                      ))}
                      {selectedComp.broken && <p className="text-red-400 text-xs mt-2">{selectedComp.breakReason}</p>}
                      <button onClick={() => {
                        setComponents(comps => comps.filter(c => c.id !== selectedComp.id));
                        setWires(ws => ws.filter(w => w.from.compId !== selectedComp.id && w.to.compId !== selectedComp.id));
                        setSelectedComp(null);
                      }} className="w-full mt-2 bg-red-900 hover:bg-red-800 text-red-200 py-1 rounded text-xs">削除</button>
                    </div>
                  </div>
                )}
              </div>
            </aside>

            {/* Main Canvas Area */}
            <main className="flex-1 relative flex flex-col">
              {/* Toolbar */}
              <div className="absolute top-4 left-4 z-20 flex gap-2">
                <button onClick={() => setIsRunning(!isRunning)} 
                        className={`px-6 py-2 rounded font-bold shadow-lg flex items-center gap-2 ${isRunning ? 'bg-red-600 hover:bg-red-500' : 'bg-green-600 hover:bg-green-500'}`}>
                  {isRunning ? '⏹ 停止' : '▶ 実行 (熱シミュレーション)'}
                </button>
                <button onClick={clearAll} className="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded shadow-lg">🗑 クリア</button>
              </div>

              {/* Status Overlay */}
              <div className="absolute top-4 right-4 z-20 bg-gray-900/80 p-3 rounded border border-gray-700 text-xs text-gray-300 pointer-events-none">
                <div className="mb-1">Time: {(simRef.current.time).toFixed(3)} s</div>
                {selectedComp && (
                  <>
                    <div className="text-yellow-400 border-t border-gray-700 pt-1 mt-1">選択部品情報</div>
                    <div>V: {selectedComp.currentV !== undefined ? selectedComp.currentV.toFixed(3) : 0} V</div>
                    <div>I: {selectedComp.currentI !== undefined ? (selectedComp.currentI*1000).toFixed(2) : 0} mA</div>
                    <div>P: {selectedComp.currentP !== undefined ? (selectedComp.currentP*1000).toFixed(2) : 0} mW</div>
                    <div className={selectedComp.tj > 100 ? 'text-red-400' : 'text-blue-300'}>
                      Tj: {selectedComp.tj ? selectedComp.tj.toFixed(1) : 25.0} ℃
                    </div>
                  </>
                )}
              </div>

              {/* Canvas Container */}
              <div className="flex-1 grid-bg relative"
                   onPointerMove={handlePointerMove}
                   onPointerUp={handlePointerUp}
                   onPointerLeave={handlePointerUp}>
                
                <svg ref={canvasRef} className="svg-canvas" 
                  onPointerDown={() => { setSelectedComp(null); setWiringStart(null); setWireEndPos(null); }}>
                  <defs>
                    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1" />
                    </marker>
                  </defs>
                  {renderWires()}
                  {components.map(renderComponentSvg)}
                  
                  {wiringStart && wireEndPos && (
                    <line x1={wiringStart.x*GRID_SIZE} y1={wiringStart.y*GRID_SIZE} 
                          x2={wireEndPos.x*GRID_SIZE} y2={wireEndPos.y*GRID_SIZE}
                          stroke="#94a3b8" strokeWidth="2" strokeDasharray="4" />
                  )}
                </svg>
              </div>

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
