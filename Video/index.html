<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぷよテト動画譜面コンバーター</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --primary-color: #4b4b7c;
            --primary-hover-color: #6a6aff;
            --font-color: #e0e0e0;
            --border-color: #4b4b7c;
            --canvas-bg-color: #0f0f18;
            --font-display: 'Orbitron', sans-serif;
            --font-ui: 'Noto Sans JP', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--font-color);
            font-family: var(--font-ui);
            overflow-x: hidden;
        }
        .orbitron { font-family: var(--font-display); }
        .btn {
            background-color: var(--primary-color);
            color: var(--font-color);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-display);
            transition: background-color 0.2s;
            text-align: center;
            display: inline-block;
        }
        .btn:hover:not(:disabled) { background-color: var(--primary-hover-color); }
        .btn:disabled { background-color: #333; color: #888; cursor: not-allowed; }
        .btn-green { background-color: #00a000; }
        .btn-green:hover:not(:disabled) { background-color: #00c000; }
        .btn-red { background-color: #f00000; }
        .btn-red:hover:not(:disabled) { background-color: #ff3b3b; }
        .btn-blue { background-color: #00a0f0; }
        .btn-blue:hover:not(:disabled) { background-color: #3bc0ff; }

        input[type="file"] { display: none; }
        label.btn { padding: 10px 16px; }

        .card {
            background-color: rgba(15, 15, 24, 0.8);
            border: 2px solid var(--border-color);
            border-radius: 10px;
        }
        
        .page-card {
            background-color: var(--canvas-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .page-card canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* プログレスバー */
        progress {
            width: 100%;
            height: 10px;
            -webkit-appearance: none;
            appearance: none;
        }
        progress::-webkit-progress-bar {
            background-color: var(--canvas-bg-color);
            border-radius: 5px;
        }
        progress::-webkit-progress-value {
            background-color: var(--primary-hover-color);
            border-radius: 5px;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="container mx-auto max-w-6xl space-y-6">

        <h1 class="text-3xl md:text-4xl font-bold text-center orbitron text-white">
            ぷよテト動画 譜面コンバーター
        </h1>
        <p class="text-center text-yellow-300">シミュレータの画像認識ロジックを流用しています (ぷよテト専用)</p>

        <!-- 1. アップロード -->
        <div id="stepUpload" class="card p-6 space-y-4">
            <h2 class="text-2xl orbitron text-center">Step 1: 動画をアップロード</h2>
            <p class="text-center">ぷよテトの16:9の録画ファイル（1P vs 2P）を選択してください。</p>
            <div class="flex justify-center">
                <label for="videoUpload" class="btn btn-green">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                    </svg>
                    動画ファイルを選択
                </label>
                <input type="file" id="videoUpload" accept="video/*">
            </div>
            <video id="videoPlayer" class="hidden w-full h-auto rounded-lg" muted playsinline></video>
        </div>

        <!-- 2. 処理中 -->
        <div id="stepProcessing" class="card p-6 space-y-4 hidden">
            <h2 class="text-2xl orbitron text-center">Step 2: スキャン処理中...</h2>
            <p class="text-center">動画のネクスト変化を検出し、盤面をスキャンしています。処理には時間がかかります。</p>
            
            <progress id="scanProgress" value="0" max="100"></progress>
            <p id="scanStatus" class="text-center font-mono"></p>
            <canvas id="snapshotCanvas" class="w-full max-w-md mx-auto h-auto rounded-lg hidden"></canvas>

            <div class="flex justify-center">
                <button id="cancelScanBtn" class="btn btn-red">キャンセル</button>
            </div>
        </div>

        <!-- 3. 結果 -->
        <div id="stepResults" class="card p-6 space-y-6 hidden">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="text-2xl orbitron text-center">Step 3: スキャン完了</h2>
                <div class="flex gap-2">
                    <button id="regenLinkBtn" class="btn btn-blue">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.899 2.101A1 1 0 0116 8H4a1 1 0 01-.894-.553A7.002 7.002 0 014 2zm12 14a1 1 0 01-1-1v-2.101a7.002 7.002 0 01-11.899-2.101A1 1 0 014 12h12a1 1 0 01.894.553A7.002 7.002 0 0116 18z" clip-rule="evenodd" />
                        </svg>
                        リンク再生成
                    </button>
                    <button id="backToStartBtn" class="btn">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.707-10.293a1 1 0 00-1.414-1.414l-3 3a1 1 0 000 1.414l3 3a1 1 0 001.414-1.414L9.414 11H13a1 1 0 100-2H9.414l1.293-1.293z" clip-rule="evenodd" />
                        </svg>
                        最初に戻る
                    </button>
                </div>
            </div>

            <div class="space-y-2">
                <label for="fumenLink" class="font-bold">テト譜エディタ共有リンク:</label>
                <input type="text" id="fumenLink" readonly class="w-full p-2 rounded-lg bg-gray-900 border border-gray-700 text-white font-mono">
                <a id="fumenLinkAnchor" href="#" target="_blank" class="btn btn-green w-full">
                    テト譜エディタで開く
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block ml-2" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z" />
                        <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z" />
                    </svg>
                </a>
            </div>

            <div class="space-y-4">
                <h3 class="text-xl orbitron">詳細オプション (おじゃま除去)</h3>
                <div class="flex flex-wrap gap-x-6 gap-y-2">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="optRemoveSoloGarbage" checked class="form-checkbox bg-gray-900 border-gray-700 rounded text-blue-500">
                        片方にしかないおじゃまを除去
                    </label>
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="optPreferMino" checked class="form-checkbox bg-gray-900 border-gray-700 rounded text-blue-500">
                        おじゃまとミノが競合したらミノ優先
                    </label>
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="optCleanFloating" checked class="form-checkbox bg-gray-900 border-gray-700 rounded text-blue-500">
                        空中に浮いたおじゃまを除去
                    </label>
                </div>
            </div>

            <h3 class="text-xl orbitron">スキャン結果 (<span id="pageCount">0</span> ページ)</h3>
            <p>ネクストが変化した瞬間のスナップショットです。</p>
            <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- 結果カードがここに追加されます -->
            </div>
        </div>

    </div>

    <!-- 処理用キャンバス (非表示) -->
    <canvas id="processingCanvas" style="display: none;"></canvas>

    <script>
        // --- 定数 ---
        const BOARD_WIDTH = 10;
        const BOARD_HEIGHT = 40;
        const BOARD_VISIBLE_HEIGHT = 20;
        const FUMEN_EDITOR_URL = "https://selmtoe.github.io/Tetris_Simulator/F/index.html"; // ご指定のURL
        const RLE_EQUAL_CHAR = 'E'; // 差分なしを示す文字

        // --- 色定義 (ぷよテト準拠) ---
        // スキャン用の色定義 (RGB)
        // Tetris Simulator (index.html-174.txt) から流用
        const SCAN_COLOR_PALETTE = {
            'NULL': [{ r: 48, g: 40, b: 56 }, { r: 0, g: 0, b: 0 }], // 黒 or 背景
            'G':    [{ r: 153, g: 153, b: 153 }, { r: 216, g: 216, b: 216 }], // おじゃま
            'I':    [{ r: 1, g: 152, b: 153 }, { r: 1, g: 153, b: 213 }], // I
            'O':    [{ r: 153, g: 154, b: 2 }, { r: 249, g: 185, b: 0 }],   // O
            'T':    [{ r: 152, g: 0, b: 153 }, { r: 135, g: 30, b: 136 }],  // T
            'L':    [{ r: 153, g: 103, b: 0 }, { r: 245, g: 97, b: 0 }],    // L
            'J':    [{ r: 0, g: 0, b: 187 }, { r: 0, g: 75, b: 165 }],    // J
            'S':    [{ r: 16, g: 151, b: 31 }, { r: 92, g: 181, b: 35 }],   // S
            'Z':    [{ r: 153, g: 0, b: 0 }, { r: 218, g: 24, b: 34 }]     // Z
        };
        // 譜面表示用の色 (16進数)
        const COLORS = { 
            'I': '#00f0f0', 'O': '#f0f000', 'T': '#a000f0', 'L': '#f0a000', 
            'J': '#00f0f0', 'S': '#00f000', 'Z': '#f00000', 'G': '#999999' 
        };

        // --- DOM要素 ---
        const $ = (id) => document.getElementById(id);
        const stepUpload = $("stepUpload");
        const stepProcessing = $("stepProcessing");
        const stepResults = $("stepResults");
        const videoUpload = $("videoUpload");
        const videoPlayer = $("videoPlayer");
        const scanProgress = $("scanProgress");
        const scanStatus = $("scanStatus");
        const cancelScanBtn = $("cancelScanBtn");
        const snapshotCanvas = $("snapshotCanvas");
        const processingCanvas = $("processingCanvas");
        const resultsGrid = $("resultsGrid");
        const fumenLink = $("fumenLink");
        const fumenLinkAnchor = $("fumenLinkAnchor");
        const pageCount = $("pageCount");
        const regenLinkBtn = $("regenLinkBtn");
        const backToStartBtn = $("backToStartBtn");
        // オプション
        const optRemoveSoloGarbage = $("optRemoveSoloGarbage");
        const optPreferMino = $("optPreferMino");
        const optCleanFloating = $("optCleanFloating");

        // --- 状態変数 ---
        let state = {
            videoFile: null,
            videoDuration: 0,
            isProcessing: false,
            p1Events: [], // { time, board, hold, next, frame }
            p2Events: [], // 同上
            combinedEvents: [], // { time, p1Data, p2Data, frame }
        };

        // =====================================================================
        //  STEP 1: アップロード
        // =====================================================================
        
        videoUpload.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (file) {
                state.videoFile = file;
                const url = URL.createObjectURL(file);
                videoPlayer.src = url;
                
                videoPlayer.classList.remove("hidden");
                stepUpload.classList.add("hidden");
                stepProcessing.classList.remove("hidden");
                
                await new Promise(r => videoPlayer.onloadedmetadata = r);
                
                state.videoDuration = videoPlayer.duration;
                state.isProcessing = true;
                state.p1Events = [];
                state.p2Events = [];
                scanProgress.value = 0;
                snapshotCanvas.classList.remove("hidden");
                
                await processVideoFrames();
                
                if (state.isProcessing) { // キャンセルされていなければ
                    processResults();
                }
                state.isProcessing = false;
            }
        });

        // =====================================================================
        //  STEP 2: スキャン処理 (メイン)
        // =====================================================================
        
        cancelScanBtn.addEventListener("click", () => {
            state.isProcessing = false; // ループを停止
            stepProcessing.classList.add("hidden");
            stepUpload.classList.remove("hidden"); // アップロードに戻る
        });

        // メインの動画処理ループ
        async function processVideoFrames() {
            videoPlayer.pause();
            videoPlayer.currentTime = 0;

            const ctx = processingCanvas.getContext('2d');
            const snapCtx = snapshotCanvas.getContext('2d');
            
            // ぷよテトは16:9 (1280x720) が基本
            // 動画のネイティブサイズに合わせる
            processingCanvas.width = videoPlayer.videoWidth;
            processingCanvas.height = videoPlayer.videoHeight;
            snapshotCanvas.width = 640; // スナップショットは小さく
            snapshotCanvas.height = 360;

            let lastP1Next = null;
            let lastP2Next = null;
            
            // 30fps想定
            const frameInterval = 1 / 30; 
            let currentTime = 0;

            // requestAnimationFrameベースのループ
            return new Promise((resolve) => {
                async function scanLoop() {
                    if (!state.isProcessing) {
                        resolve();
                        return;
                    }

                    // 1. 動画の現在時刻をセット
                    videoPlayer.currentTime = currentTime;
                    await new Promise(r => videoPlayer.onseeked = r);

                    // 2. キャンバスに描画
                    ctx.drawImage(videoPlayer, 0, 0, processingCanvas.width, processingCanvas.height);

                    // 3. ぷよテトのレイアウトでスキャン (シミュレータロジック流用)
                    const p1Data = scanPptFrame(ctx, 'p1');
                    const p2Data = scanPptFrame(ctx, 'p2');

                    // 4. ネクストの変化を検出 (ご要望の「一番最後のミノ」)
                    const currentP1Next = p1Data.next.length > 0 ? p1Data.next[p1Data.next.length - 1] : null;
                    const currentP2Next = p2Data.next.length > 0 ? p2Data.next[p2Data.next.length - 1] : null;

                    let p1Changed = false;
                    let p2Changed = false;

                    if (lastP1Next !== null && currentP1Next !== lastP1Next) {
                        p1Changed = true;
                    }
                    if (lastP2Next !== null && currentP2Next !== lastP2Next) {
                        p2Changed = true;
                    }

                    // 5. 変化があればイベントを記録
                    if (p1Changed || p2Changed) {
                        snapCtx.drawImage(videoPlayer, 0, 0, snapshotCanvas.width, snapshotCanvas.height);
                        const frame = snapshotCanvas.toDataURL("image/jpeg", 0.5);

                        if (p1Changed) {
                            state.p1Events.push({
                                time: currentTime,
                                board: p1Data.board,
                                hold: p1Data.hold,
                                next: p1Data.next.join(''),
                                frame: frame
                            });
                        }
                        if (p2Changed) {
                             state.p2Events.push({
                                time: currentTime,
                                board: p2Data.board,
                                hold: p2Data.hold,
                                next: p2Data.next.join(''),
                                frame: frame
                            });
                        }
                    }
                    
                    // 6. 状態を更新
                    lastP1Next = currentP1Next;
                    lastP2Next = currentP2Next;

                    // 7. UIを更新
                    scanProgress.value = (currentTime / state.videoDuration) * 100;
                    scanStatus.textContent = `Time: ${currentTime.toFixed(2)}s / ${state.videoDuration.toFixed(2)}s | P1 Events: ${state.p1Events.length} | P2 Events: ${state.p2Events.length}`;
                    
                    // 8. 次のフレームへ
                    currentTime += frameInterval;
                    if (currentTime > state.videoDuration) {
                        resolve(); // 終了
                    } else {
                        requestAnimationFrame(scanLoop); // 次のループ
                    }
                }
                scanLoop(); // ループ開始
            });
        }

        /**
         * ぷよテトの固定レイアウトに基づいてフレームをスキャンする
         * (index.html-174.txt の processPptImage ロジックを流用・改変)
         */
        function scanPptFrame(ctx, playerId) {
            const width = ctx.canvas.width;
            const scale = width / 1280; // 1280px幅を基準にする
            const result = {
                board: createEmptyBoardData(),
                hold: null,
                next: []
            };

            // --- Board Recognition ---
            const baseBoardCoords = {
                p1: { x1: 205, y1: 106, x2: 445, y2: 596 },
                p2: { x1: 835, y1: 106, x2: 1075, y2: 596 }
            };
            const boardCoords = baseBoardCoords[playerId];
            const boardTopLeft = { x: boardCoords.x1 * scale, y: boardCoords.y1 * scale };
            const boardWidthPx = (boardCoords.x2 - boardCoords.x1) * scale;
            const boardHeightPx = (boardCoords.y2 - boardCoords.y1) * scale;
            const blockWidthPx = boardWidthPx / BOARD_WIDTH;
            const blockHeightPx = boardHeightPx / BOARD_VISIBLE_HEIGHT;
            
            for (let r = 0; r < BOARD_VISIBLE_HEIGHT; r++) {
                for (let c = 0; c < BOARD_WIDTH; c++) {
                    const sampleX = boardTopLeft.x + (c + 0.5) * blockWidthPx;
                    const sampleY = boardTopLeft.y + (r + 0.5) * blockHeightPx;
                    const sampleSize = Math.max(1, Math.floor(blockWidthPx * 0.25));
                    
                    const avgColor = getAverageColor(ctx, sampleX, sampleY, sampleSize / 2);
                    const mino = findClosestColor(avgColor.r, avgColor.g, avgColor.b);
                    
                    result.board[BOARD_HEIGHT - BOARD_VISIBLE_HEIGHT + r][c] = mino;
                }
            }

            // --- Next Queue Recognition ---
            const nextCoordsP1 = [ { x: 160, y: 155 }, { x: 500, y: 122 }, { x: 500, y: 175 }, { x: 500, y: 225 }, { x: 500, y: 275 }, { x: 500, y: 325 } ];
            const nextCoordsP2 = [ { x: 790, y: 155 }, { x: 1130, y: 122 }, { x: 1130, y: 175 }, { x: 1130, y: 225 }, { x: 1130, y: 275 }, { x: 1130, y: 325 } ];
            const nextCoords = (playerId === 'p1') ? nextCoordsP1 : nextCoordsP2;
            const radius = 5 * scale;

            for (let i = 0; i < nextCoords.length; i++) {
                const coord = nextCoords[i];
                const sampleX = coord.x * scale;
                const sampleY = coord.y * scale;
                
                const avgColor = getAverageColorNonBlack(ctx, sampleX, sampleY, radius);
                const isBlack = avgColor.r < 50 && avgColor.g < 50 && avgColor.b < 50;
                
                if (i === 1 && isBlack) { // 最初のネクストが黒ならキューは空
                    break;
                }
                
                const foundMino = findClosestMinoOnly(avgColor.r, avgColor.g, avgColor.b);
                
                if (i === 0) {
                    result.hold = isBlack ? null : foundMino;
                } else {
                    result.next.push(foundMino);
                }
            }
            return result;
        }


        // =====================================================================
        //  画像認識ヘルパー (index.html-174.txt から流用)
        // =====================================================================
        
        /**
         * 1ピクセルの色(R,G,B)に最も近いミノを返す
         */
        function findClosestColor(r, g, b) {
            const inputColor = { r, g, b };
            const colorDistanceSq = (c1, c2) => {
                return Math.pow(c1.r - c2.r, 2) + Math.pow(c1.g - c2.g, 2) + Math.pow(c1.b - c2.b, 2);
            };
            
            // NULL (背景) チェックを最初に行う
            for (const nullColor of SCAN_COLOR_PALETTE.NULL) {
                if (colorDistanceSq(inputColor, nullColor) < 6000) { // しきい値は調整
                    return null;
                }
            }

            let minDistance = Infinity;
            let closestKey = null;

            // G (おじゃま) チェック
            for (const gColor of SCAN_COLOR_PALETTE.G) {
                const distance = colorDistanceSq(inputColor, gColor);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestKey = 'G';
                }
            }

            // ミノチェック
            const minoKeys = Object.keys(SCAN_COLOR_PALETTE).filter(k => k !== 'NULL' && k !== 'G');
            for (const key of minoKeys) {
                for (const targetColor of SCAN_COLOR_PALETTE[key]) {
                    const distance = colorDistanceSq(inputColor, targetColor);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestKey = key;
                    }
                }
            }
            
            // 最終的なしきい値
            return (minDistance > 25000) ? null : closestKey;
        }
        
        /**
         * ミノ専用 (NULL/G を返さない)
         */
        function findClosestMinoOnly(r, g, b) {
            const inputColor = { r, g, b };
            const colorDistanceSq = (c1, c2) => {
                return Math.pow(c1.r - c2.r, 2) + Math.pow(c1.g - c2.g, 2) + Math.pow(c1.b - c2.b, 2);
            };

            let minDistance = Infinity;
            let closestKey = 'I'; // デフォルト
            
            const minoKeys = Object.keys(SCAN_COLOR_PALETTE).filter(k => k !== 'NULL' && k !== 'G');
            
            for (const key of minoKeys) {
                for (const targetColor of SCAN_COLOR_PALETTE[key]) {
                    const distance = colorDistanceSq(inputColor, targetColor);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestKey = key;
                    }
                }
            }
            return closestKey;
        }

        /**
         * 指定座標のピクセル平均色を取得 (矩形)
         */
        function getAverageColor(ctx, cx, cy, radius) {
            const startX = Math.floor(cx - radius);
            const startY = Math.floor(cy - radius);
            const diameter = Math.ceil(radius * 2);
            if (startX < 0 || startY < 0 || startX + diameter > ctx.canvas.width || startY + diameter > ctx.canvas.height) {
                return { r: 0, g: 0, b: 0 };
            }
            const imageData = ctx.getImageData(startX, startY, diameter, diameter).data;
            let totalR = 0, totalG = 0, totalB = 0;
            for (let i = 0; i < imageData.length; i += 4) {
                totalR += imageData[i];
                totalG += imageData[i + 1];
                totalB += imageData[i + 2];
            }
            const count = imageData.length / 4;
            return { r: totalR / count, g: totalG / count, b: totalB / count };
        }

        /**
         * 指定座標のピクセル平均色を取得 (円形、黒を除く)
         */
        function getAverageColorNonBlack(ctx, cx, cy, radius) {
            const startX = Math.floor(cx - radius);
            const startY = Math.floor(cy - radius);
            const diameter = Math.ceil(radius * 2);
            if (startX < 0 || startY < 0 || startX + diameter > ctx.canvas.width || startY + diameter > ctx.canvas.height) {
                return { r: 0, g: 0, b: 0 };
            }
            const imageData = ctx.getImageData(startX, startY, diameter, diameter).data;
            
            let totalR = 0, totalG = 0, totalB = 0, count = 0;
            const radiusSq = radius * radius;
            const blackThreshold = 50; 

            for (let y = 0; y < diameter; y++) {
                for (let x = 0; x < diameter; x++) {
                    const dx = x - radius;
                    const dy = y - radius;
                    
                    if (dx * dx + dy * dy <= radiusSq) {
                        const i = (y * diameter + x) * 4;
                        const r = imageData[i];
                        const g = imageData[i + 1];
                        const b = imageData[i + 2];
                        
                        if (r > blackThreshold || g > blackThreshold || b > blackThreshold) {
                            totalR += r;
                            totalG += g;
                            totalB += b;
                            count++;
                        }
                    }
                }
            }
            
            if (count === 0) {
                return { r: 0, g: 0, b: 0 };
            }
            
            return { r: totalR / count, g: totalG / count, b: totalB / count };
        }
        
        function createEmptyBoardData() {
            return Array.from({ length: BOARD_HEIGHT }, () => Array(BOARD_WIDTH).fill(null));
        }


        // =====================================================================
        //  STEP 3: 結果処理・統合 (前回答から流用)
        // =====================================================================

        function processResults() {
            stepProcessing.classList.add("hidden");
            stepResults.classList.remove("hidden");

            mergeAndCleanEvents();
            generateAndShowFumenLink();
            displayResultPages();
        }

        regenLinkBtn.addEventListener("click", () => {
            mergeAndCleanEvents();
            generateAndShowFumenLink();
        });

        backToStartBtn.addEventListener("click", () => {
            state = { videoFile: null, videoDuration: 0, isProcessing: false, p1Events: [], p2Events: [], combinedEvents: [] };
            videoPlayer.src = "";
            videoUpload.value = "";
            stepResults.classList.add("hidden");
            stepUpload.classList.remove("hidden");
            videoPlayer.classList.add("hidden");
            resultsGrid.innerHTML = "";
            fumenLink.value = "";
            fumenLinkAnchor.href = "#";
        });

        /**
         * 1Pと2Pのイベントを時間軸でマージし、クリーンアップする
         */
        function mergeAndCleanEvents() {
            const { p1Events, p2Events } = state;
            const merged = [];
            let i = 0, j = 0;
            let lastP1Data = { board: createEmptyBoardData(), hold: null, next: "" };
            let lastP2Data = { board: createEmptyBoardData(), hold: null, next: "" };

            // 1. マージソート
            while (i < p1Events.length || j < p2Events.length) {
                let event;
                let frame;
                if (i < p1Events.length && (j >= p2Events.length || p1Events[i].time <= p2Events[j].time)) {
                    // P1 イベント
                    event = p1Events[i++];
                    frame = event.frame;
                    lastP1Data = { board: event.board, hold: event.hold, next: event.next };
                    merged.push({ time: event.time, p1Data: { ...lastP1Data }, p2Data: { ...lastP2Data }, frame: frame });
                } else {
                    // P2 イベント
                    event = p2Events[j++];
                    frame = event.frame;
                    lastP2Data = { board: event.board, hold: event.hold, next: event.next };
                    merged.push({ time: event.time, p1Data: { ...lastP1Data }, p2Data: { ...lastP2Data }, frame: frame });
                }
            }
            
            // 2. クリーンアップ
            if (!optRemoveSoloGarbage.checked && !optPreferMino.checked && !optCleanFloating.checked) {
                state.combinedEvents = merged;
                return;
            }

            const cleanedEvents = [];
            for (const event of merged) {
                const cleanedP1Board = event.p1Data.board.map(row => [...row]);
                const cleanedP2Board = event.p2Data.board.map(row => [...row]);

                // おじゃま除去ロジック
                if (optRemoveSoloGarbage.checked || optPreferMino.checked) {
                    for (let y = 0; y < BOARD_HEIGHT; y++) {
                        for (let x = 0; x < BOARD_WIDTH; x++) {
                            const p1Cell = cleanedP1Board[y][x];
                            const p2Cell = cleanedP2Board[y][x];
                            const p1isG = p1Cell === 'G';
                            const p2isG = p2Cell === 'G';
                            const p1isMino = p1Cell && !p1isG;
                            const p2isMino = p2Cell && !p2isG;

                            if (optPreferMino.checked) {
                                if (p1isG && p2isMino) cleanedP1Board[y][x] = null;
                                if (p2isG && p1isMino) cleanedP2Board[y][x] = null;
                            }
                            if (optRemoveSoloGarbage.checked) {
                                if (p1isG && !p2Cell) cleanedP1Board[y][x] = null;
                                if (p2isG && !p1Cell) cleanedP2Board[y][x] = null;
                            }
                        }
                    }
                }
                
                if (optCleanFloating.checked) {
                    cleanFloatingGarbage(cleanedP1Board);
                    cleanFloatingGarbage(cleanedP2Board);
                }

                cleanedEvents.push({ 
                    ...event, 
                    p1Data: { ...event.p1Data, board: cleanedP1Board }, 
                    p2Data: { ...event.p2Data, board: cleanedP2Board } 
                });
            }
            
            state.combinedEvents = cleanedEvents;
        }
        
        /**
         * 浮いているおじゃまを消す (破壊的メソッド)
         */
        function cleanFloatingGarbage(board) {
            const visited = Array.from({ length: BOARD_HEIGHT }, () => Array(BOARD_WIDTH).fill(false));
            const stack = [];

            for (let x = 0; x < BOARD_WIDTH; x++) {
                if (board[BOARD_HEIGHT - 1][x] !== null) {
                    stack.push([BOARD_HEIGHT - 1, x]);
                } else if (board[BOARD_HEIGHT - 1][x] === null) {
                    // 最下段のnullも探索起点
                    stack.push([BOARD_HEIGHT - 1, x]);
                }
            }

            while (stack.length > 0) {
                const [y, x] = stack.pop();

                if (y < 0 || y >= BOARD_HEIGHT || x < 0 || x >= BOARD_WIDTH || visited[y][x]) {
                    continue;
                }
                
                visited[y][x] = true;
                const cell = board[y][x];

                if (cell === null) {
                    stack.push([y - 1, x]); // 上も探索
                } else if (cell === 'G' || (cell && cell !== 'G')) { // おじゃま or ミノ
                    stack.push([y - 1, x]); // 上
                    stack.push([y + 1, x]); // 下
                    stack.push([y, x - 1]); // 左
                    stack.push([y, x + 1]); // 右
                }
            }

            for (let y = 0; y < BOARD_HEIGHT; y++) {
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    if (board[y][x] === 'G' && !visited[y][x]) {
                        board[y][x] = null;
                    }
                }
            }
        }
        
        /**
         * 譜面データを表示
         */
        function displayResultPages() {
            resultsGrid.innerHTML = "";
            pageCount.textContent = state.combinedEvents.length;

            state.combinedEvents.forEach((event, index) => {
                const card = document.createElement("div");
                card.className = "page-card";
                
                const time = document.createElement("p");
                time.className = "text-sm text-center font-mono";
                time.textContent = `Page ${index + 1} (${event.time.toFixed(2)}s)`;

                const canvas = document.createElement("canvas");
                canvas.width = 640;
                canvas.height = 360;
                const ctx = canvas.getContext("2d");
                
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                };
                img.src = event.frame;
                
                card.appendChild(time);
                card.appendChild(canvas);
                resultsGrid.appendChild(card);
            });
        }
        
        // =====================================================================
        //  テト譜 圧縮・生成ロジック (テト譜エディタから流用)
        // =====================================================================
        
        function generateAndShowFumenLink() {
            const fumenData = {
                v: 'f2', // 圧縮形式
                m: '2P', // 常に2Pモードとしてエクスポート
                p: []
            };

            let prevP1Board1D = null;
            let prevP2Board1D = null;

            for (let i = 0; i < state.combinedEvents.length; i++) {
                const event = state.combinedEvents[i];
                const pageData = {};

                const currentP1Board1D = boardToString(event.p1Data.board).split('');
                const currentP2Board1D = boardToString(event.p2Data.board).split('');
                
                let p1BoardCompressed;
                if (i === 0) {
                    p1BoardCompressed = encodeRLE(currentP1Board1D);
                } else {
                    const diff = getDifference(prevP1Board1D, currentP1Board1D);
                    p1BoardCompressed = encodeRLE(diff);
                }
                pageData.p1 = { 
                    b: p1BoardCompressed, 
                    h: event.p1Data.hold || '', 
                    n: event.p1Data.next || ''
                };
                prevP1Board1D = currentP1Board1D;

                let p2BoardCompressed;
                if (i === 0) {
                    p2BoardCompressed = encodeRLE(currentP2Board1D);
                } else {
                    const diff = getDifference(prevP2Board1D, currentP2Board1D);
                    p2BoardCompressed = encodeRLE(diff);
                }
                pageData.p2 = { 
                    b: p2BoardCompressed, 
                    h: event.p2Data.hold || '', 
                    n: event.p2Data.next || ''
                };
                prevP2Board1D = currentP2Board1D;
                
                fumenData.p.push(pageData);
            }

            try {
                const jsonString = JSON.stringify(fumenData);
                const uint8Array = new TextEncoder().encode(jsonString);
                
                let binaryString = '';
                const CHUNK_SIZE = 8192; 
                for (let i = 0; i < uint8Array.length; i += CHUNK_SIZE) {
                    const chunk = uint8Array.subarray(i, i + CHUNK_SIZE);
                    binaryString += String.fromCharCode.apply(null, chunk);
                }
                const base64Data = btoa(binaryString);
                
                const url = `${FUMEN_EDITOR_URL}#${base64Data}`;
                fumenLink.value = url;
                fumenLinkAnchor.href = url;
            } catch (e) {
                console.error("Base64エンコード失敗:", e);
                fumenLink.value = "エラー: 譜面データが大きすぎるか、生成に失敗しました。";
                fumenLinkAnchor.href = "#";
            }
        }

        function boardToString(board) {
            return board.map(row => 
                row.map(cell => cell === null ? '_' : cell).join('')
            ).join('');
        }

        function encodeRLE(data) {
            if (!data || data.length === 0) return [];
            const rle = [];
            let lastValue = data[0];
            let count = 1;
            for (let i = 1; i < data.length; i++) {
                const currentValue = data[i];
                if (currentValue === lastValue) {
                    count++;
                } else {
                    rle.push([lastValue, count]);
                    lastValue = currentValue;
                    count = 1;
                }
            }
            rle.push([lastValue, count]);
            return rle;
        }

        function getDifference(prevBoard1D, currentBoard1D) {
            const diff = [];
            const len = BOARD_WIDTH * BOARD_HEIGHT;
            for (let i = 0; i < len; i++) {
                const prev = prevBoard1D[i];
                const curr = currentBoard1D[i];
                diff.push(prev === curr ? RLE_EQUAL_CHAR : curr);
            }
            return diff;
        }

    </script>
